[package]
name = "thermo-craft"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded thermo-craft research evaluator"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "float_roundtrip"] }
sha2 = "=0.10.9"
pyo3 = { version = "=0.29.0", optional = true, features = ["abi3-py310"] }
